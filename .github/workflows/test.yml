name: Test

on:
  push:
    branches: [main, copilot/**, 001-mvp-core]
  pull_request:
    branches: [main, 001-mvp-core]

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest", "windows-latest"]'
      gate-commands: |
        npm run lint
        npm run format:check
        npm run typecheck
        npm run test

  # Examples double as a smoke test, and coverage/codecov run on a single
  # canonical leg -- see the inline comments. Not expressible through the
  # reusable ci.yml (no per-matrix-leg conditionals, no way to slot a
  # codecov upload action into gate-commands), so this stays a native job
  # alongside the reusable `test` job above.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Examples double as a smoke test (each asserts what it demonstrates).
      - name: Examples
        run: npm run examples

      # Coverage is intrinsically machine-independent for our code, so it's
      # enforced on a single canonical platform rather than every leg.
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
