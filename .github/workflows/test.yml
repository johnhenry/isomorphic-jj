name: Test

on:
  push:
    branches: [main, copilot/**, 001-mvp-core]
  pull_request:
    branches: [main, 001-mvp-core]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS intentionally excluded: hosted macOS runners are the
        # scarcest/slowest to schedule, and this is a pure-JS library with
        # no native/platform-specific code path — Linux + Windows already
        # cover the realistic cross-platform risk (path separators, line
        # endings, filesystem case-sensitivity).
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Format check
        run: npm run format:check
      
      - name: Type check
        run: npm run typecheck
      
      - name: Test
        run: npm test

      # Examples double as a smoke test (each asserts what it demonstrates).
      # One leg is enough — they exercise library behavior, not platform
      # behavior — and it's a different leg than the coverage gate to keep
      # per-job wall time balanced.
      - name: Examples
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run examples

      # Coverage thresholds are enforced on a single canonical platform. Coverage
      # is intrinsically machine-independent for our code, so running the gate on
      # every OS only adds cross-platform flakiness without extra signal.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
