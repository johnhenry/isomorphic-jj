name: Test

on:
  push:
    branches: [main, copilot/**, 001-mvp-core]
  pull_request:
    branches: [main, 001-mvp-core]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Format check
        run: npm run format:check
      
      - name: Type check
        run: npm run typecheck
      
      - name: Test
        run: npm test

      # Coverage thresholds are enforced on a single canonical platform. Coverage
      # is intrinsically machine-independent for our code, so running the gate on
      # every OS only adds cross-platform flakiness without extra signal.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
