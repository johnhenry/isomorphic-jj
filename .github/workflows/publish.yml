name: Publish to npm

# Deliberately triggered only by pushing a version tag (e.g. `v1.7.0`) —
# no workflow_dispatch escape hatch, so there is exactly one, explicit way to
# publish. A failed run can be retried via "Re-run failed jobs" in the
# Actions UI without needing to recreate the tag.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # Enables npm provenance (attests this build came from this repo/workflow)

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional extra gate: create an "npm-publish" environment in the repo's
    # Settings > Environments and add required reviewers to demand manual
    # approval before this job runs. With no such environment configured,
    # this line is a no-op and the job runs immediately.
    environment: npm-publish

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
