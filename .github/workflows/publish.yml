name: Publish to npm

# Publish model: main is the release branch. A push to main publishes only if
# package.json's version isn't on npm yet (otherwise a clean no-op), then tags
# v<version> and creates a GitHub Release. See johnhenry/workflows' README.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # tag + GitHub Release by-product of npm-publish.yml
      id-token: write # npm provenance
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # Folds in the pre-publish tag/package.json version check that used
      # to be its own step -- the reusable workflow only exposes a single
      # gate-commands script, so it runs first here and exits non-zero
      # (failing the gate) on a mismatch.
      gate-commands: |
        # Both @johnhenry/isomorphic-jj and the unscoped isomorphic-jj mirror
        # (publish-unscoped.yml) publish the same version on every release --
        # see CHANGELOG.md's 1.9.0 entry for why. Refuse to publish a version
        # that would move EITHER name's `latest` tag backward (a version equal to
        # what is already live is fine: that name's publish is a clean no-op), so this can't
        # silently regress into a version-number downgrade on either side.
        node -e '
          const semverParts = (v) => v.split(".").map(Number);
          const gt = (a, b) => { const A = semverParts(a), B = semverParts(b); for (let i = 0; i < 3; i++) { if (A[i] > B[i]) return true; if (A[i] < B[i]) return false; } return false; };
          const { execSync } = require("child_process");
          const live = (pkg) => { try { return execSync(`npm view ${pkg} version`, { encoding: "utf8" }).trim(); } catch { return "0.0.0"; } };
          const newVersion = require("./package.json").version;
          const scoped = live("@johnhenry/isomorphic-jj");
          const unscoped = live("isomorphic-jj");
          if (gt(scoped, newVersion) || gt(unscoped, newVersion)) {
            console.error(`::error::${newVersion} must not be lower than the scoped (${scoped}) or unscoped (${unscoped}) published versions`);
            process.exit(1);
          }
        '
        npm run lint
        npm run format:check
        npm run typecheck
        npm run test:coverage
        npm run build
    secrets: inherit
