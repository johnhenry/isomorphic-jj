name: Publish to npm

# Deliberately triggered only by pushing a version tag (e.g. `v1.7.0`) —
# no workflow_dispatch escape hatch, so there is exactly one, explicit way to
# publish. A failed run can be retried via "Re-run failed jobs" in the
# Actions UI without needing to recreate the tag.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required by the reusable workflow's provenance step --
        # see johnhenry/workflows' README for why this must be declared here too.
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # Folds in the pre-publish tag/package.json version check that used
      # to be its own step -- the reusable workflow only exposes a single
      # gate-commands script, so it runs first here and exits non-zero
      # (failing the gate) on a mismatch.
      gate-commands: |
        PKG_VERSION="v$(node -p "require('./package.json').version")"
        TAG_VERSION="${GITHUB_REF#refs/tags/}"
        if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
          exit 1
        fi
        npm run lint
        npm run format:check
        npm run typecheck
        npm run test:coverage
        npm run build
    secrets: inherit
